# TypeScript bindings generated by ts-rs (issue #9).
#
# `make bindings` (or any `cargo test`) writes `ui/src/lib/generated/*.ts` next to the
# hand-written types. The i64 columns are plain numbers in the UI, and the imports carry
# the `.ts` extension so the Node test runner can load the files directly.
[env]
TS_RS_EXPORT_DIR = { value = "ui/src/lib/generated", relative = true }
TS_RS_LARGE_INT = "number"
TS_RS_IMPORT_EXTENSION = "ts"
