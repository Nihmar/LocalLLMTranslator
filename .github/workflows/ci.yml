name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  sidecar:
    name: sidecar (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: sidecar/uv.lock
      - name: Install uv project
        working-directory: sidecar
        run: uv sync --all-groups
      - name: Format
        working-directory: sidecar
        run: uv run ruff format --check .
      - name: Lint
        working-directory: sidecar
        run: uv run ruff check .
      - name: Type check
        working-directory: sidecar
        run: uv run pyright
      - name: Test
        working-directory: sidecar
        run: uv run pytest

  ui:
    name: ui (typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Type check
        working-directory: ui
        run: npm run typecheck
      - name: Lint
        working-directory: ui
        run: npm run lint
      - name: Build
        working-directory: ui
        run: npm run build

  rust:
    name: app (rust)
    runs-on: ubuntu-latest
    needs: ui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/app
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Toolchain metadata
        run: cargo --version && rustc --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      # `tauri::generate_context!` needs the frontend bundle to exist, so the UI job
      # runs first and this job rebuilds it: the two are not independent.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build frontend for the context macro
        working-directory: ui
        run: npm ci && npm run build
      - name: Check
        run: cargo check
