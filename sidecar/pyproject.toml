[project]
name = "llmtranslator-sidecar"
version = "0.1.0"
description = "Stateless data-plane sidecar for LocalLLMTranslator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
marker = ["marker-pdf>=1.0.0"]
# Packaging only: `uv run --extra package python -m build_sidecar`.
package = ["pyinstaller>=6.10"]

[dependency-groups]
dev = [
    "jinja2>=3.1.4",
    "pyright>=1.1.380",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
llmtranslator-sidecar = "llmtranslator_sidecar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmtranslator_sidecar"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["llmtranslator_sidecar", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",   # no copyright headers in this project
    "D",        # docstrings: only where the *why* is not obvious
    "COM812",   # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
# A packaging script prints its progress; that is its user interface.
"build_sidecar.py" = ["T201"]
"tests/*" = [
    "ANN",
    "C901",     # a long end-to-end test is still one test
    "E501",
    "INP001",   # tests are not a package
    "PLC0415",  # local imports keep optional tooling optional
    "PLR2004",  # magic values are fine in assertions
    "PTH119",
    "PT018",    # composite assertions read better in a test
    "S101",     # assert is the point of a test
    "S310",     # the fixture server is a local http:// URL by design
    "S603",     # invoking pandoc/pdflatex is the subject under test
    "PLW1510",
    "SLF001",
]

[tool.pyright]
include = ["llmtranslator_sidecar", "tests"]
exclude = [
    "**/__pycache__",
    # Loads tools/fake_llama_server.py and tools/make_fixtures.py by file path with
    # importlib, so every value crossing that boundary is `Unknown` and no amount of
    # annotations can help. The library keeps strict checking; this file is covered by
    # ruff and by actually running.
    "tests/test_support_tools.py",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["llmtranslator_sidecar"]
omit = ["*/tests/*"]
