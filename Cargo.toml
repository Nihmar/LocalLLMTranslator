[workspace]
resolver = "2"
members = ["crates/app", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["LocalLLMTranslator contributors"]

# Single source of truth for dependency versions across the workspace.
[workspace.dependencies]
tauri = { version = "2" }
tauri-build = { version = "2" }
tauri-plugin-shell = { version = "2" }
tauri-plugin-dialog = { version = "2" }

axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
clap = { version = "4", features = ["derive"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "sync",
    "time",
    "io-util",
    "fs",
    "signal",
] }
sqlx = { version = "0.9", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "migrate",
    "macros",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "rustls",
    "charset",
    "http2",
] }
futures-util = "0.3"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
minijinja = "2"
parking_lot = "0.12"
regex = "1"
async-trait = "0.1"
bytes = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Test-only helpers.
wiremock = "0.6"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
