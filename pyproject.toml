[project]
name = "local-llm-translator"
version = "0.1.0"
description = "A translator which uses a local LLM"
readme = "README.md"
authors = [
    { name = "nihmar", email = "manente.alessandro@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx",
    "pymupdf4llm",
    "textual",
]

[project.scripts]
llm-translate = "local_llm_translator.__main__:main"

[dependency-groups]
dev = [
    "fastapi>=0.137.2",
    "pyright>=1.1.410",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.17",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_llm_translator"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "TC003", "PLC0415", "PLR2004", "S108", "B017", "PT011"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = "-ra --cov=local_llm_translator --cov-report=term-missing"
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src"]
